# Docker's embedded DNS; resolving per request lets nginx start before
# the upstream containers are ready.
resolver 127.0.0.11 valid=10s ipv6=off;

# every request shows up in the test output otherwise
access_log off;

ssl_certificate     /certs/server.crt;
ssl_certificate_key /certs/server.key;

server {
	listen 80 default_server;

	location = /healthz {
		access_log off;
		return 200;
	}

	location / {
		return 301 https://$host$request_uri;
	}
}

server {
	listen 443 ssl;
	server_name e2e.tabroom.test;

	location / {
		set $upstream_schemats http://schemats:3000;
		proxy_pass $upstream_schemats;

		# SvelteKit's Link preload header alone can pass the 4k default
		proxy_buffer_size 16k;
		proxy_buffers 8 16k;
		# stream responses past the buffers (fonts) instead of spilling them to a temp file
		proxy_max_temp_file_size 0;

		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
}

server {
	listen 443 ssl;
	server_name api.e2e.tabroom.test;

	location / {
		set $upstream_indexcards http://indexcards:8001;
		proxy_pass $upstream_indexcards;

		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
}
