name: Publish Docker Image

inputs:
  registry:
    default: registry.speechanddebate.org
  image:
    description: The docker image
    required: true
  registry_username:
    required: true
  registry_password:
    required: true
  channel:
    required: true
    description: Moving tag docker-build added, production or staging

runs:
  using: composite
  steps:
    - name: Login to registry
      shell: bash
      run: |
        echo "${{ inputs.registry_password }}" |
          docker login "${{ inputs.registry }}" \
            --username "${{ inputs.registry_username }}" \
            --password-stdin

    - name: Tag image
      shell: bash
      run: |
        docker tag \
          "${{ inputs.image }}:${FORGEJO_SHA}" \
          "${{ inputs.registry }}/nsda/${{ inputs.image }}:${FORGEJO_SHA}"

        docker tag \
          "${{ inputs.image }}:${{ inputs.channel }}" \
          "${{ inputs.registry }}/nsda/${{ inputs.image }}:${{ inputs.channel }}"

    - name: Push image
      shell: bash
      run: |
        IMAGE="${{ inputs.registry }}/nsda/${{ inputs.image }}"

        echo "Pushing ${IMAGE}:${FORGEJO_SHA}"
        docker push "${IMAGE}:${FORGEJO_SHA}"

        echo "Pushing ${IMAGE}:${{ inputs.channel }}"
        docker push "${IMAGE}:${{ inputs.channel }}"
