name: Indexcards CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: CI
    runs-on: linux-amd64
    services:
      mariadb:
        image: mariadb:12
        ports:
          - '3306:3306'
        env:
          MARIADB_DATABASE: tabroom
          MARIADB_USER: tabroom
          MARIADB_PASSWORD: tabroom
          MARIADB_ROOT_PASSWORD: root
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Copy indexcards config
        run: |
          cp .forgejo/config/config.ci.json indexcards/config/config.json

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ./package.json

      - name: Install dependancies
        run: |
            npm ci

      - name: Lint
        run: |
            npm run lint --workspace=indexcards

      - name: Typecheck
        run: |
            npm run typecheck --workspace=indexcards
            
      - name: Install MariaDB client
        run: |
          apt-get update
          apt-get install -y mariadb-client
      
      - name: Seed database
        run: |
          mariadb \
            --host=mariadb-test \
            --port=3306 \
            --user=tabroom \
            --password=tabroom \
            tabroom < ./indexcards/tests/test.sql
          
      - name: Test
        run: |
            npm run test-ci --workspace=indexcards
