name: Indexcards CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: CI
    runs-on: linux-amd64
    services:
      mariadb-test:
        image: mariadb:12
        ports:
          - '3306:3306'
        env:
          MARIADB_DATABASE: tabroom
          MARIADB_ROOT_PASSWORD: tabroom

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Copy indexcards config
        run: |
          cp .forgejo/config/config.ci.json indexcards/config/config.json

      - name: Install dependancies
        run: |
            npm ci

      - name: Lint
        run: |
            npm run lint --workspace=indexcards

      - name: Typecheck
        run: |
            npm run typecheck --workspace=indexcards

      - name: Test
        run: |
            npm run test-ci --workspace=indexcards
