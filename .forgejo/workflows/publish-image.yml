name: Push Docker Image

# Pushes a supplied image to the S&D registry.
# Pushes all tags that exist on the supplied image.
# Tag the image before calling this workflow.

on:
  workflow_call:
    inputs:
      image:
        description: "Docker image name"
        required: true
        type: string

jobs:
  push:
    runs-on: linux-amd64

    env:
      REGISTRY: registry.speechanddebate.org

    steps:
    - name: Login to registry
      env:
        REGISTRY_USERNAME: ${{ secrets.registry_username }}
        REGISTRY_PASSWORD: ${{ secrets.registry_password }}
      run: |
        echo "username is ${#REGISTRY_USERNAME} chars"
        echo "password is ${#REGISTRY_PASSWORD} chars"
    
        printf '%s' "$REGISTRY_PASSWORD" |
          docker login "$REGISTRY" \
            --username "$REGISTRY_USERNAME" \
            --password-stdin
        
      - name: Login to registry
        run: |
          echo "${{ secrets.registry_password }}" |
            docker login "$REGISTRY" \
              --username "${{ secrets.registry_username }}" \
              --password-stdin

      - name: Push image
        run: |
          docker push --all-tags "$REGISTRY/${{ inputs.image }}"
