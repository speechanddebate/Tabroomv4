name: Deploy

on:
  push:
    branches:
      - main

env:
  IMAGE: registry.speechanddebate.org/indexcards

jobs:
  build:
    runs-on: linux-amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        run: |
          docker build \
            -f indexcards/Dockerfile \
            -t "$IMAGE:${FORGEJO_SHA}" \
            -t "$IMAGE:latest" \
            .

  publish:
    needs: build
    uses: ./.forgejo/workflows/publish-image.yml
    with:
      image: indexcards
