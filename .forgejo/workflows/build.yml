name: Build

on:
  # manual trigger for emergencies
  workflow_dispatch:
    inputs:
      channel:
        description: Moving tag for the images
        type: choice
        options: [production, staging]
        default: production
  # called by ci.yml once all checks pass on main or staging
  workflow_call:
    inputs:
      channel:
        type: string
        required: true

jobs:
  build-indexcards:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        uses: ./.forgejo/actions/docker-build
        with:
          image: indexcards
          dockerfile: indexcards/Dockerfile
          channel: ${{ inputs.channel }}

      - name: Publish image
        uses: ./.forgejo/actions/docker-publish
        with:
          image: indexcards
          channel: ${{ inputs.channel }}
          registry_username: ${{ secrets.REGISTRY_USERNAME }}
          registry_password: ${{ secrets.REGISTRY_PASSWORD }}

  build-schemats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        uses: ./.forgejo/actions/docker-build
        with:
          image: schemats
          dockerfile: schemats/Dockerfile
          channel: ${{ inputs.channel }}

      - name: Publish image
        uses: ./.forgejo/actions/docker-publish
        with:
          image: schemats
          channel: ${{ inputs.channel }}
          registry_username: ${{ secrets.REGISTRY_USERNAME }}
          registry_password: ${{ secrets.REGISTRY_PASSWORD }}
